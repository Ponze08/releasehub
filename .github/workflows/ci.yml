name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/ReleaseHub.Api/ReleaseHub.Api.csproj

      - name: Build
        run: dotnet build backend/ReleaseHub.Api/ReleaseHub.Api.csproj --configuration Release --no-restore
